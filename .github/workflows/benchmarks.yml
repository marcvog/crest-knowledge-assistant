name: Performance benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Install dependencies
        run: uv sync --locked --group performance --python 3.12
      - name: Run offline benchmarks
        run: |
          mkdir -p performance/results/ci
          uv run --no-sync pytest performance/benchmarks -q --benchmark-json=performance/results/ci/benchmark.json
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: performance/results/ci/benchmark.json
          if-no-files-found: error
