name: Update submodule and extract semantic entities

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force_extraction:
        description: Run extraction even if the submodule is unchanged
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: submodule-update
  cancel-in-progress: false

jobs:
  update-and-extract:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Update submodule
        id: submodule
        run: |
          git submodule update --remote --checkout data/CrestApi

          submodule_sha="$(git -C data/CrestApi rev-parse --short=12 HEAD)"
          echo "sha=$submodule_sha" >> "$GITHUB_OUTPUT"

          if git diff --quiet -- data/CrestApi; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report that submodule is up to date
        if: steps.submodule.outputs.changed == 'false' &&
            !inputs.force_extraction
        run: |
          echo "The data/CrestApi submodule is already up to date."
          echo "No extraction or feature branch is required."
          echo "Workflow completed successfully."

          echo "### No submodule update required" >> "$GITHUB_STEP_SUMMARY"
          echo "The \`data/CrestApi\` submodule is already up to date." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Create feature branch
        if: steps.submodule.outputs.changed == 'true' ||
            inputs.force_extraction == true
        run: |
          branch="automation/update-crestapi-${{ steps.submodule.outputs.sha }}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          echo "FEATURE_BRANCH=$branch" >> "$GITHUB_ENV"

      - name: Set up Python
        if: steps.submodule.outputs.changed == 'true' ||
            inputs.force_extraction == true
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.submodule.outputs.changed == 'true' ||
            inputs.force_extraction == true
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install dependencies
        if: steps.submodule.outputs.changed == 'true' ||
            inputs.force_extraction == true
        run: uv sync

      - name: Extract semantic entities
        if: steps.submodule.outputs.changed == 'true' ||
            inputs.force_extraction == true
        run: |
          uv run python src/crest_knowledge_assistant/extraction/semantic_entity_extractor.py

      - name: Commit extracted entities and submodule update
        if: steps.submodule.outputs.changed == 'true' ||
            inputs.force_extraction == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/CrestApi
          git add index/
          git add version/

          git commit -m "Update CrestApi and extract semantic entities"
          git push --set-upstream origin "$FEATURE_BRANCH"