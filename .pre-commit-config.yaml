# Keep external sources and generated artifacts out of local checks.
exclude: ^(data|documents|index|version)/

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep this version aligned with Ruff in uv.lock.
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
