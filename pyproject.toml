[project]
name = "crest-knowledge-assistant"
version = "0.1.0"
description = "AI-powered engineering assistant for the CERN ATLAS CREST ecosystem"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "dotenv>=0.9.9",
    "gitpython>=3.1.58",
    "langchain>=1.4.1",
    "langchain-anthropic>=1.7.2",
    "langchain-openai>=1.6.2",
    "langchain-openrouter>=0.2.8",
    "openai>=2.53.0",
    "pymilvus[milvus-lite]>=3.0.1",
    "streamlit>=1.62.0",
    "tree-sitter",
    "tree-sitter-cpp",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crest_knowledge_assistant"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["data", "documents", "index", "version"]
force-exclude = true

[tool.ruff.lint]
# Ruff's baseline error checks, plus import sorting.
select = [
    "E4", "E7", "E9",
    "F", "I", "B", "UP",
    "SIM", "C4", "DTZ",
    "PT", "T10", "RUF",
    "S", "PERF", "C90",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]