[project]
name = "crest-knowledge-assistant"
version = "0.1.0"
description = "AI-powered engineering assistant for the CERN ATLAS CREST ecosystem"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "gitpython>=3.1.58",
    "openai>=2.53.0",
    "tree-sitter",
    "tree-sitter-cpp",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crest_knowledge_assistant"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
